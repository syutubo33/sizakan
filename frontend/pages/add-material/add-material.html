<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIZAKAN 資材登録</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

    <div class="material-box">
        <h1>SIZAKAN</h1>
        <h2>資材登録</h2>

        <form>
            <div class="row">
                <label>資材名</label>
                <input type="text" name="name" placeholder="例：Lポリ袋" required>
            </div>

            <div class="row">
                <label>単位</label>
                <input type="text" name="unit" placeholder="例：個" required>
            </div>

            <div class="row">
                <label>現在在庫数</label>
                <input type="number" name="stock" placeholder="例：50" required>
            </div>

            <div class="row">
                <label>最低在庫数（アラート）</label>
                <input type="number" name="alert" placeholder="例：20" required>
            </div>

            <div class="row">
                <label>備考</label>
                <textarea name="note" placeholder="メモがあれば入力"></textarea>
            </div>

            <button type="submit" class="register-btn">資材を登録</button>
        </form>
    </div>

    <!-- 下部ナビゲーション -->
    <div class="bottom-nav">
        <a href="../items/list.html">在庫一覧</a>
        <a href="add-material.html" class="active">資材登録</a>
        <a href="../history/history.html">履歴</a>
        <a href="../settings/settings.html">設定</a>
    </div>

<script src="../add-material/add-material.js"></script>
</body>
</html>
