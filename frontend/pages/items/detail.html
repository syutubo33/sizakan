<!DOCTYPE html>
<html>

                <label>資材名</label>

            </div>

            <div class="detail-item">
                <label>在庫数</label>
                <p id="detail-quantity">-</p>

            <div class="detail-item">
                <label>単位</label>
                <p id="detail-unit">-</p>

            <div class="detail-item">
                <label>状態</label>
                <p id="detail-status">-</p>
            </div>

            <div class="detail-item">
                <label>備考</label>
                <p id="detail-remarks">-</p>

            <div class="detail-actions">
                <a href="index.html" class="back-btn">← 戻る</a>
