<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIZAKAN メールアドレス変更</title>
    <link rel="stylesheet" href="../../../assets/css/style.css">
</head>
<body>

    <div class="password-box">

        <!-- 戻るボタン -->
        <a href="../../settings/settings.html" class="back-btn">← 設定に戻る</a>

        <h1>SIZAKAN</h1>
        <h2>メールアドレス変更</h2>

        <form>
            <div class="pw-row">
                <label>現在のメールアドレス</label>
                <input type="email" name="current" placeholder="現在のメールアドレス">
            </div>

            <div class="pw-row">
                <label>新しいメールアドレス</label>
                <input type="email" name="new" placeholder="新しいメールアドレス">
            </div>

            <div class="pw-row">
                <label>新しいメールアドレス（確認）</label>
                <input type="email" name="confirm" placeholder="もう一度入力">
            </div>

            <button type="submit" class="save-btn">変更する</button>
        </form>
    </div>

</body>
</html>
