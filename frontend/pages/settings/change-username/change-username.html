<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIZAKAN ユーザーネーム変更</title>
    <link rel="stylesheet" href="../../../assets/css/style.css">
</head>
<body>

    <div class="password-box">

        <!-- 戻るボタン -->
        <a href="../../settings/settings.html" class="back-btn">← 設定に戻る</a>

        <h1>SIZAKAN</h1>
        <h2>ユーザーネーム変更</h2>

        <form>
            <div class="pw-row">
                <label>現在のユーザーネーム</label>
                <input type="text" name="current" placeholder="現在のユーザーネーム">
            </div>

            <div class="pw-row">
                <label>新しいユーザーネーム</label>
                <input type="text" name="new" placeholder="新しいユーザーネーム">
            </div>

            <button type="submit" class="save-btn">変更する</button>
        </form>
    </div>

</body>
</html>
