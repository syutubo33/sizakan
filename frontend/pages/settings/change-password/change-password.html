<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIZAKAN パスワード変更</title>
    <link rel="stylesheet" href="../../../assets/css/style.css">
</head>
<body>

    <div class="password-box">

        <!-- 戻るボタン -->
        <a href="../../settings/settings.html" class="back-btn">← 設定に戻る</a>

        <h1>SIZAKAN</h1>
        <h2>パスワード変更</h2>

        <form>
            <div class="pw-row">
                <label>現在のパスワード</label>
                <input type="password" name="current" placeholder="現在のパスワード">
            </div>

            <div class="pw-row">
                <label>新しいパスワード</label>
                <input type="password" name="new" placeholder="新しいパスワード">
            </div>

            <div class="pw-row">
                <label>新しいパスワード（確認）</label>
                <input type="password" name="confirm" placeholder="もう一度入力">
            </div>

            <button type="submit" class="save-btn">変更する</button>
        </form>
    </div>

</body>
</html>
